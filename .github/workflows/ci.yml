name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Self-check every example
        run: |
          for f in examples/*.html; do
            python skills/social-post-design/scripts/check.py "$f"
          done
      - name: Validate plugin manifests
        run: python -c "import json; [json.load(open(f)) for f in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']]"
